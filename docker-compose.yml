services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    # Bind to localhost only — all public traffic goes through nginx
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # SQLite database file persists here across image updates
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # certbot writes certs here on the host; nginx reads them read-only
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
