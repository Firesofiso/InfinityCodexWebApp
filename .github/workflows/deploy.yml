name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build the Docker image and push it to GitHub Container Registry ─────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs — dramatically speeds up builds after the first
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Pull the new image and restart the app on your Linux server ─────────────
  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Update deployment files
        # Pull the latest docker-compose.yml and nginx.conf from the repo
        run: git pull origin main
        working-directory: /opt/infinity-codex

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker compose pull
        working-directory: /opt/infinity-codex

      - name: Restart application
        run: docker compose up -d --remove-orphans
        working-directory: /opt/infinity-codex
