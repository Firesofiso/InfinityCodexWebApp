<section class="space-y-5">
  <h2 class="text-xl font-semibold text-white">Member Roster</h2>
  <p class="text-sm text-white/60">All active linkshell members. Click a character name to view their profile.</p>

  @if (pageError()) {
    <div class="rounded-md border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm text-red-100">
      {{ pageError() }}
    </div>
  }
  

  <app-master-list
    [columns]="columns"
    [data]="rows()"
    [actions]="actions"
    [searchable]="true"
    searchPlaceholder="Search by character name or job..."
    [searchFields]="['characterName', 'preferredJobs', 'level75Jobs']"
    [loading]="isLoading()"
    loadingMessage="Loading roster..."
    emptyMessage="No members found."
  />
</section>
