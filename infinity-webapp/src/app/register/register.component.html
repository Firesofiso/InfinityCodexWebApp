<div class="min-h-screen bg-linear-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex flex-col items-center justify-center px-4">
    <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-10 flex flex-col items-center w-full max-w-md">
        <h1 class="text-5xl font-extrabold text-white mb-3 drop-shadow-lg">Infinity</h1>
        <p class="text-white/80 text-center text-lg mb-8">You're approved to register. Finish your profile to access your codex.</p>

        @if (loading()) {
            <div class="w-full">
                <p class="text-white text-center text-lg mb-6">Loading your registration details...</p>
                <button
                    type="button"
                    class="w-full px-6 py-2.5 bg-white/15 text-white font-semibold rounded-lg border border-white/20 hover:bg-white/25 transition-all duration-200"
                >
                    Please wait
                </button>
            </div>
        } @else {
            <form class="w-full flex flex-col gap-4" (ngSubmit)="submit()">
                <label class="text-white text-sm font-semibold" for="displayName">Display name</label>
                <input
                    id="displayName"
                    name="displayName"
                    [(ngModel)]="displayName"
                    maxlength="64"
                    class="w-full px-4 py-2.5 rounded-lg bg-white/15 border border-white/20 text-white placeholder:text-white/60 focus:outline-none focus:ring-4 focus:ring-indigo-300"
                    placeholder="How should we show your name?"
                    required
                />

                <label class="text-white text-sm font-semibold" for="preferredJobs">Preferred jobs (optional)</label>
                <input
                    id="preferredJobs"
                    name="preferredJobs"
                    [(ngModel)]="preferredJobsRaw"
                    class="w-full px-4 py-2.5 rounded-lg bg-white/15 border border-white/20 text-white placeholder:text-white/60 focus:outline-none focus:ring-4 focus:ring-indigo-300"
                    placeholder="Comma-separated, e.g. Warrior, White Mage"
                />

                @if (errorMessage()) {
                    <p class="text-amber-200 text-sm">{{ errorMessage() }}</p>
                }

                <button
                    type="submit"
                    [disabled]="submitting()"
                    class="w-full px-8 py-3 bg-linear-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-lg shadow-lg hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300 disabled:opacity-70"
                >
                    {{ submitting() ? 'Saving...' : 'Complete Registration' }}
                </button>
            </form>
        }
    </div>
</div>
