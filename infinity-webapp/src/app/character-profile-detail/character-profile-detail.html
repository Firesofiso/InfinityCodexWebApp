<div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-8 flex flex-col w-full max-w-md">
    <h4>Job Levels</h4>
    <div class="flex flex-wrap">
        @for (job of allJobs; track job) {
                <div class="flex w-1/2 justify-between">
                    <p>{{ job }}</p>
                    <p 
                        [class.text-blue-500]="character.jobLevels[job] == 75"
                        [class.text-gray-600]="character.jobLevels[job] == 0">
                        {{ character.jobLevels[job] ?? '0' }}
                    </p>
                </div>
        }
    </div>
</div>
