<aside class="h-full w-16 md:w-20 bg-white/5 backdrop-blur border-r border-white/10 flex flex-col items-center py-4 gap-4">
  <div class="w-12 h-12 rounded-2xl bg-indigo-500/80 grid place-items-center font-bold text-lg shadow-lg">
    <lucide-angular [img]="Orbit" class="my-icon" />
  </div>

  <nav class="flex flex-col gap-3">
    <a
      routerLink="/app/characters"
      routerLinkActive="bg-cyan-400/20 text-cyan-50"
      aria-label="Characters"
      class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80"
    >
      <span class="text-xs font-semibold"><lucide-angular [img]="User" class="my-icon" /></span>
    </a>
    <a
      routerLink="/app/roster"
      routerLinkActive="bg-cyan-400/20 text-cyan-50"
      aria-label="Member Roster"
      class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80"
    >
      <span class="text-xs font-semibold"><lucide-angular [img]="Users" class="my-icon" /></span>
    </a>
    @if (canManageRoles()) {
      <a
        routerLink="/app/access"
        routerLinkActive="bg-cyan-400/20 text-cyan-50"
        aria-label="Roles and Permissions"
        class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80"
      >
        <span class="text-xs font-semibold"><lucide-angular [img]="Shield" class="my-icon" /></span>
      </a>
    }
    <!-- <a
      routerLink="/app/catalog"
      routerLinkActive="bg-cyan-400/20 text-cyan-50"
      aria-label="Item Catalog"
      class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80"
    >
      <span class="text-xs font-semibold"><lucide-angular [img]="BookOpen" class="my-icon" /></span>
    </a>
    <a
      routerLink="/app/dashboard"
      routerLinkActive="bg-cyan-400/20 text-cyan-50"
      aria-label="Dashboard"
      class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80"
    >
      <span class="text-xs font-semibold"><lucide-angular [img]="Home" class="my-icon" /></span>
    </a> -->
  </nav>

  <div class="mt-auto flex flex-col gap-2">
    @if (isImpersonating()) {
      <button
        type="button"
        (click)="stopImpersonation()"
        [disabled]="stoppingImpersonation()"
        aria-label="Stop impersonation"
        class="w-12 h-12 rounded-2xl bg-amber-500/20 hover:bg-amber-500/30 transition grid place-items-center cursor-pointer text-amber-100 disabled:cursor-not-allowed disabled:opacity-70"
      >
        <span class="text-[10px] font-semibold leading-tight text-center px-1">{{ stoppingImpersonation() ? '...' : 'STOP' }}</span>
      </button>
    }

    <button
      type="button"
      (click)="logout()"
      [disabled]="loggingOut()"
      aria-label="Log out"
      class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 transition grid place-items-center cursor-pointer text-white/80 disabled:cursor-not-allowed disabled:opacity-70"
    >
      <span class="text-xs font-semibold"><lucide-angular [img]="LogOut" class="my-icon" /></span>
    </button>
  </div>

</aside>
