<div class="min-h-full flex flex-col gap-6">
    @if (authState() === 'checking') {
        <div class="bg-white/10 border border-white/15 rounded-2xl p-6 text-white/90">
            Loading your dashboard session...
        </div>
    } @else {
        <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-6 flex flex-col gap-4">
            <div class="flex items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold text-white">Infinity Codex</h1>
                    <p class="text-white/80">Signed in as {{ session()?.name || 'adventurer' }}</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button
                        (click)="refreshSession()"
                        class="px-4 py-2 bg-white/15 text-white font-semibold rounded-lg border border-white/20 hover:bg-white/25 transition-all duration-200"
                    >
                        Refresh session
                    </button>
                    <button
                        (click)="logout()"
                        class="px-4 py-2 bg-white/15 text-white font-semibold rounded-lg border border-white/20 hover:bg-white/25 transition-all duration-200"
                    >
                        Log out
                    </button>
                </div>
            </div>

            @if (authError()) {
                <p class="text-amber-200 text-sm">{{ authError() }}</p>
            }
        </div>

        <app-character-profile-detail></app-character-profile-detail>
        <full-calendar [options]="calendarOptions"></full-calendar>
    }
</div>
