<div class="min-h-full flex flex-col items-center justify-center">
	<app-character-profile-detail></app-character-profile-detail>
	<full-calendar [options]="calendarOptions"></full-calendar>

	<div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-10 flex flex-col items-center w-full max-w-md">
		<h1 class="text-5xl font-extrabold text-white mb-10 drop-shadow-lg">Infinity</h1>

		@if (isLoggedIn()) {
			<div class="w-full">
				<div class="flex items-center justify-center gap-3 text-emerald-200 mb-6">
					<span class="inline-flex h-3 w-3 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]"></span>
					<span class="text-sm font-semibold uppercase tracking-[0.2em]">Logged In</span>
				</div>
				<p class="text-white text-center text-lg mb-6">Welcome back. Your Discord session is active.</p>
				<div class="flex flex-col gap-3">
					<button (click)="checkAuth()" class="px-6 py-2.5 bg-white/15 text-white font-semibold rounded-lg border border-white/20 hover:bg-white/25 transition-all duration-200">
						Refresh session
					</button>
					<button class="px-6 py-2.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-900 font-semibold rounded-lg shadow-lg hover:from-emerald-300 hover:to-teal-400 transition-all duration-200">
						Continue to the app
					</button>
				</div>
			</div>
		}
		
		@if (!isLoggedIn()) {
			<div class="w-full">
				<p class="text-white/80 text-center text-lg mb-8">Sign in with Discord to unlock your personalized codex.</p>
				<button (click)="discordLogin()" class="w-full px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-lg shadow-lg hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-300">
					<span class="inline-flex items-center gap-2">
						<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.369a19.791 19.791 0 00-16.634 0A4.21 4.21 0 001.5 8.228v7.543a4.21 4.21 0 002.183 3.86 19.791 19.791 0 0016.634 0 4.21 4.21 0 002.183-3.86V8.228a4.21 4.21 0 00-2.183-3.859zM9.545 15.568V9.432l6.182 3.068-6.182 3.068z"/></svg>
						Login with Discord
					</span>
				</button>
			</div>
		}
	</div>
</div>
